[package]
name = "twincursor-engine-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "tc-engine: the call engine the desktop app starts, driven over JSON lines on stdin and stdout"
publish = false

[[bin]]
name = "tc-engine"
path = "src/main.rs"

[dependencies]
twincursor-engine = { path = "../engine" }
twincursor-media = { path = "../media" }
twincursor-control = { path = "../control" }
twincursor-ipc = { path = "../ipc" }
twincursor-protocol = { path = "../protocol" }
livekit.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
# Reads call passes (JWTs); already in the tree through jsonwebtoken.
base64.workspace = true
