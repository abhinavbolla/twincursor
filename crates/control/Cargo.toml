[package]
name = "twincursor-control"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TwinCursor remote-control sessions: consent, input checks and safety on the sharer, and the guest's side"

[lib]
name = "control"

[dependencies]
twincursor-protocol = { path = "../protocol" }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["platform_specific"] }
core-graphics = "0.25"
core-foundation = "0.10"
