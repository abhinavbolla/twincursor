[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/abhinavbolla/twincursor"

[workspace.dependencies]
livekit = { version = "0.10.0", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.9.1", default-features = false, features = ["access-token"] }
screencapturekit = { version = "=11.1.1", features = ["macos_15_0"] }
winit = "0.30"
softbuffer = "0.4"
font8x8 = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
