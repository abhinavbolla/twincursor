name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Apple Silicon: matches our dev machines and the mac-arm64 libwebrtc build.
    # macOS 26 / Xcode 26: screencapturekit's apple-metal Swift bridge needs the macOS 26 SDK
    # (MTLTensor etc.) and fails to compile on the macos-15 image's default Xcode.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and SDK
        run: xcodebuild -version && xcrun --sdk macosx --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-libwebrtc
        with:
          triple: mac-arm64-release

      # The desktop app embeds the built UI (apps/desktop/dist), so it has to exist before the
      # app crate compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type-check, test and build the UI
        working-directory: apps/desktop
        run: |
          npx tsc --noEmit
          npx vitest run
          npx vite build

      - name: Clippy
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --release --workspace

  # Builds every crate with the oldest Rust the workspace promises to support (`rust-version` in
  # Cargo.toml, which every crate inherits).
  msrv:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the minimum supported Rust version
        run: |
          v=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$v" --profile minimal
          rustup default "$v"

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-libwebrtc
        with:
          triple: mac-arm64-release

      # The desktop app embeds the built UI (apps/desktop/dist).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build the UI
        working-directory: apps/desktop
        run: npm ci && npx vite build

      - name: Build
        run: cargo build --locked --release --workspace

  # The viewer runs on Windows too, so make sure it keeps building there: tc-spike for
  # development, and tc-engine for the terminal viewer package (packaging/windows).
  windows-viewer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-libwebrtc
        with:
          triple: win-x64-release

      - name: Build
        run: cargo build --locked --release -p twincursor-media-spike -p twincursor-engine-cli

      - name: Smoke test
        run: |
          target/release/tc-spike.exe view --help
          target/release/tc-engine.exe view --help
          target/release/tc-engine.exe config

  # The desktop app on Windows, where it is a guest: it joins calls and takes control, but can't
  # share. Builds the package people download (packaging/windows/package-app.sh, no backend),
  # runs the tests that apply on Windows, then starts the real app (bench/windows-smoke.sh):
  # alone, and as a guest in an empty room on a LiveKit dev server.
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # No debug info in Windows release builds: a lighter link, as on testers' PCs.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      # The LiveKit dev server the smoke test joins (github.com/livekit/livekit releases).
      LIVEKIT_SERVER_VERSION: 1.13.11
      LIVEKIT_SERVER_SHA256: 5d071ea43339f0140d24a66f0b2ff8a7bf6c4d0dceb19b30abca835670213667
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-libwebrtc
        with:
          triple: win-x64-release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Type-check and test the UI
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run

      - name: Build the package (no backend)
        run: packaging/windows/package-app.sh

      # The Windows build has no warnings: the app, the engine and what they use, as the macOS
      # rust job checks them.
      - name: Clippy
        run: |
          cargo clippy --locked --release -p twincursor-engine-cli -p twincursor-engine -p twincursor-media -- -D warnings
          cargo clippy --locked --release -p twincursor-desktop -p twincursor-account -p twincursor-ipc -p twincursor-protocol -p twincursor-control --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --locked --release -p twincursor-desktop --features tauri/custom-protocol
          cargo test --locked --release -p twincursor-account -p twincursor-ipc -p twincursor-protocol -p twincursor-control

      - name: Get a LiveKit dev server
        run: |
          mkdir -p .livekit
          zip="livekit_${LIVEKIT_SERVER_VERSION}_windows_amd64.zip"
          curl -fsSL --retry 5 -o ".livekit/$zip" \
            "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_SERVER_VERSION}/$zip"
          echo "${LIVEKIT_SERVER_SHA256}  .livekit/$zip" | sha256sum -c -
          unzip -q -o ".livekit/$zip" -d .livekit
          ls .livekit

      - name: Smoke test the app
        run: |
          app=$(ls dist/TwinCursor-*-windows-x64/TwinCursor.exe)
          APP="$app" OUT=smoke LIVEKIT=.livekit/livekit-server.exe bench/windows-smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TwinCursor-windows-x64-no-backend
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-reports
          path: smoke/
          if-no-files-found: ignore

  # The backend (supabase/): the database's access rules and the call-pass Edge Function, run
  # against a local Supabase stack.
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting and lint the function
        working-directory: supabase
        run: |
          deno fmt --check --config functions/call-pass/deno.json functions tests/call-pass_e2e.ts tests/call-pass_serve.ts
          deno lint --config functions/call-pass/deno.json functions tests/call-pass_e2e.ts tests/call-pass_serve.ts

      - name: Unit-test the function
        working-directory: supabase/functions/call-pass
        run: deno task test

      - name: Start the local stack
        run: supabase start -x studio

      - name: Lint the database
        run: supabase db lint --schema public,private --fail-on warning

      - name: Test the database's access rules
        run: supabase test db

      - name: Test the function end to end
        run: supabase/tests/call-pass.sh

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup

  # Enforces the license rule in CONTRIBUTING.md, and that crates only come from crates.io.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # New advisories appear without any change here, so this reports but doesn't block a PR.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
