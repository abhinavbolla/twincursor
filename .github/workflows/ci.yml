name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Prebuilt libwebrtc is unpacked here and used instead of the LiveKit SDK's own download
  # (which re-fetches ~277 MB per build profile and fails on flaky connections).
  LK_CUSTOM_WEBRTC: ${{ github.workspace }}/.libwebrtc/mac-arm64-release

jobs:
  rust:
    # Apple Silicon: matches our dev machines and the mac-arm64 libwebrtc build.
    # macOS 26 / Xcode 26: screencapturekit's apple-metal Swift bridge needs the macOS 26 SDK
    # (MTLTensor etc.) and fails to compile on the macos-15 image's default Xcode.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and SDK
        run: xcodebuild -version && xcrun --sdk macosx --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2

      - name: Resolve libwebrtc tag
        id: webrtc
        run: |
          cargo fetch --locked
          tag=$(grep -h 'pub const WEBRTC_TAG' ~/.cargo/registry/src/*/webrtc-sys-build-*/src/lib.rs \
            | sed -E 's/.*"(.*)".*/\1/' | sort -u)
          [ "$(echo "$tag" | wc -l)" -eq 1 ] || { echo "expected one WEBRTC_TAG, got: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache libwebrtc
        id: webrtc-cache
        uses: actions/cache@v4
        with:
          path: .libwebrtc/webrtc.zip
          key: libwebrtc-mac-arm64-release-${{ steps.webrtc.outputs.tag }}

      - name: Download libwebrtc
        if: steps.webrtc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .libwebrtc
          curl -fL --retry 10 --retry-all-errors -C - -o .libwebrtc/webrtc.zip \
            "https://github.com/livekit/rust-sdks/releases/download/${{ steps.webrtc.outputs.tag }}/webrtc-mac-arm64-release.zip"

      - name: Unpack libwebrtc
        run: unzip -q .libwebrtc/webrtc.zip -d .libwebrtc && ls "$LK_CUSTOM_WEBRTC"

      - name: Clippy
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --release --workspace

      - name: Build on the minimum supported Rust version
        run: |
          v=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$v" --profile minimal
          cargo +"$v" build --locked --release -p twincursor-media-spike
