name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Apple Silicon: matches our dev machines and the mac-arm64 libwebrtc build.
    # macOS 26 / Xcode 26: screencapturekit's apple-metal Swift bridge needs the macOS 26 SDK
    # (MTLTensor etc.) and fails to compile on the macos-15 image's default Xcode.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode and SDK
        run: xcodebuild -version && xcrun --sdk macosx --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-libwebrtc
        with:
          triple: mac-arm64-release

      - name: Clippy
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --release --workspace

  # The viewer runs on Windows too, so make sure it keeps building there.
  windows-viewer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-libwebrtc
        with:
          triple: win-x64-release

      - name: Build
        run: cargo build --locked --release -p twincursor-media-spike

      - name: Smoke test
        run: target/release/tc-spike.exe view --help

  # Enforces the license rule in CONTRIBUTING.md, and that crates only come from crates.io.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # New advisories appear without any change here, so this reports but doesn't block a PR.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
