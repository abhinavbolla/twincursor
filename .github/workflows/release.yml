name: Release

on:
  push:
    tags: ["v*"]
  # Checks that the builds still work when this workflow or the packaging changes, and gives
  # testers' builds a place to come from (the run's artifacts). Nothing is published.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - packaging/**

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            webrtc: mac-arm64-release
            platform: macos-arm64
            binary: tc-spike
            packages: -p twincursor-media-spike
          - runner: windows-latest
            webrtc: win-x64-release
            platform: windows-x64
            binary: tc-spike.exe
            # The terminal viewer (packaging/windows) runs tc-engine.
            packages: -p twincursor-media-spike -p twincursor-engine-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-libwebrtc
        with:
          triple: ${{ matrix.webrtc }}

      - name: Build
        run: cargo build --locked --release ${{ matrix.packages }}

      - name: Package
        run: |
          name="tc-spike-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.binary }}" LICENSE README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -bd "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      # The terminal viewer: tc-engine and a script that asks for a name and a room code, for
      # joining a room-code call on a LiveKit server whose key is in server.txt (added by whoever
      # hands it out: packaging/windows/assemble.sh). It can't sign in or join a call link; the
      # Windows app (windows-app below) is what people want.
      - name: Package the Windows terminal viewer
        if: runner.os == 'Windows'
        run: |
          name="TwinCursor-terminal-viewer-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp target/release/tc-engine.exe LICENSE "dist/$name/"
          cp "packaging/windows/Join TwinCursor.cmd" packaging/windows/server.txt.example \
            packaging/windows/README.txt "dist/$name/"
          cd dist
          7z a -bd "$name.zip" "$name"
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  # The Windows app (TwinCursor-<version>-windows-x64.zip), with the backend from the
  # repository variables (windows-package.yml).
  windows-app:
    uses: ./.github/workflows/windows-package.yml

  # Creates a draft: a maintainer reads it and presses publish.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
