# The backend a TwinCursor build talks to, for apps/desktop/scripts/package.sh.
#
# Copy this file outside the repository, for example to ~/.config/twincursor/backend.conf, and
# fill in your Supabase project's two public values (docs/self-hosting.md):
#
#   apps/desktop/scripts/package.sh ~/.config/twincursor/backend.conf
#
# One NAME=value per line; lines starting with # are skipped. The script reads these two names
# (or SUPABASE_URL, and SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY) and refuses anything else.
#
# Both values are public by design: every copy of the app carries them. What protects the data is
# the database's row-level security and its functions. Never put a LiveKit key or secret, the
# service_role key or a secret key (sb_secret_...) here.

# Project URL: https://<project ref>.supabase.co (the dashboard's Connect dialog shows it).
TWINCURSOR_BUILD_SUPABASE_URL=https://YOUR-PROJECT.supabase.co

# The publishable key (sb_publishable_...), or the legacy anon key: Settings > API Keys.
TWINCURSOR_BUILD_SUPABASE_KEY=sb_publishable_REPLACE_ME
