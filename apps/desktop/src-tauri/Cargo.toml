[package]
name = "twincursor-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri 2.12 needs Rust 1.90; the engine crates keep the workspace's older minimum.
rust-version = "1.90"
description = "The TwinCursor desktop app: the window you open, which starts the helper"
publish = false

[[bin]]
name = "twincursor-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde.workspace = true
serde_json.workspace = true
