[package]
name = "twincursor-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri 2.12 needs Rust 1.90; the engine crates keep the workspace's older minimum.
rust-version = "1.90"
description = "The TwinCursor desktop app: the window you open, which starts the engine"
publish = false

[[bin]]
name = "twincursor-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
twincursor-ipc = { path = "../../../crates/ipc" }
twincursor-account = { path = "../../../crates/account" }
# The menu bar icon. tray-icon is already in the lockfile (Tauri's own optional dependency).
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
# The call flows' background poll and timers. Already in the tree (Tauri's own runtime).
tokio.workspace = true

# The clipboard (NSPasteboard) for call links, keeping the app out of App Nap during a call
# (NSProcessInfo), and the windows' native behaviour (NSWindow, NSScreen: no traffic lights, every
# Space, placement under the menu bar icon). Already in the tree through Tauri, with these
# features on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSProcessInfo", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSPasteboard", "NSWindow", "NSResponder", "NSView", "NSButton", "NSControl", "NSColor",
    "NSScreen", "NSEvent", "NSApplication", "NSAppearance", "NSGraphics", "objc2-core-foundation",
] }

[dev-dependencies]
twincursor-account = { path = "../../../crates/account", features = ["fake"] }
