<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 200 200">
  <!-- The TwinCursor app icon: two chevrons moving together. The other icon files in this
       folder are generated from this one (docs/RELEASING.md, "The app icon"). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset=".55" stop-color="#4648ff"/>
      <stop offset="1" stop-color="#12c6f2"/>
    </linearGradient>
    <radialGradient id="light" cx=".28" cy=".16" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f7ff"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#1c1a7a" flood-opacity=".42"/>
    </filter>
    <filter id="mark-shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1c1a7a" flood-opacity=".55"/>
    </filter>
  </defs>

  <g filter="url(#tile-shadow)">
    <rect x="18" y="14" width="164" height="164" rx="40" fill="url(#bg)"/>
  </g>
  <rect x="18" y="14" width="164" height="164" rx="40" fill="url(#light)"/>
  <rect x="18" y="14" width="164" height="164" rx="40" fill="url(#shade)"/>
  <rect x="19" y="15" width="162" height="162" rx="39" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#mark-shadow)">
    <polyline points="64,60 100,96 64,132" stroke="#fff" stroke-opacity=".5" stroke-width="23"/>
    <polyline points="103,60 139,96 103,132" stroke="url(#front)" stroke-width="23"/>
  </g>
  <polyline points="103,55.5 136,88.5" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.4" stroke-linecap="round"/>
</svg>
